function load(){

function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),3600);}
function updateSaveIndicator(){

  el.textContent=saveError?'⚠ Error al guardar':dirty?'● Cambios sin guardar':prefs.autoSave?'✓ Guardado automático':'✓ Guardado manual';
  el.title=saveError||(!prefs.autoSave?'El modo manual requiere pulsar Guardar cambios':'Cada modificación se guarda al confirmarla');

let lastSnapshotTime=0;
function persist(force=false){
  try{
    const current=JSON.stringify(state);
    if(current===savedJSON&&!force){dirty=false;saveError='';updateSaveIndicator();return true;}
    localStorage.setItem(KEY,current);savedJSON=current;dirty=false;storageAvailable=true;saveError='';updateSaveIndicator();
    if(Date.now()-lastSnapshotTime>10*60*1000){lastSnapshotTime=Date.now();createSnapshot(current,false).catch(()=>{});}
    return true;
  }catch(error){
    console.error('No se pudieron guardar los datos',error);dirty=true;saveError='Almacenamiento lleno o bloqueado';updateSaveIndicator();

const checklist=(day,id)=>state.checklists.find(x=>x.date===day&&x.staffId===id);
const briefing=(day,id)=>state.briefings.find(x=>x.date===day&&x.staffId===id);
const dayNum=date=>fromISO(date).getDay();
function vacationOn(w,date){return (w?.vacations||[]).find(v=>v.start<=date&&date<=v.end)||null;}
function defaultStatus(w,date){
  if(vacationOn(w,date))return 'vacation';
  if(w.scheduleMode==='weekend')return [0,6].includes(dayNum(date))?'support':'off';
  return (w.restDays||[]).includes(dayNum(date))?'rest':'working';
}
function scheduleStatus(date,id){
  const p=worker(id),roster=state.rosters[date];
  if(!p)return 'off';
  if(p.active===false&&date>=dateISO()&&!inspection(date,id)&&!checklist(date,id)&&!briefing(date,id))return 'off';
  // Las vacaciones tienen prioridad sobre los estados anteriores, salvo que se retire el período.
  if(vacationOn(p,date))return 'vacation';
  if(Object.prototype.hasOwnProperty.call(roster?.overrides||{},id))return roster.overrides[id];
  // Las fechas históricas mantienen el estado de su programación registrada.
  if(date<dateISO()&&Object.prototype.hasOwnProperty.call(roster?.staff||{},id))return roster.staff[id];
  return p.active===false?'off':defaultStatus(p,date);
}
function activeFor(date,w){return w.active!==false||state.rosters[date]?.staff?.[w.id]!==undefined||!!inspection(date,w.id)||!!checklist(date,w.id)||!!briefing(date,w.id);}
function forDate(date){return state.staff.filter(w=>activeFor(date,w)).map(w=>({worker:w,status:scheduleStatus(date,w.id)})).sort((a,b)=>{
  const aw=isScheduled(a.status),bw=isScheduled(b.status);return Number(bw)-Number(aw)||a.worker.name.localeCompare(b.worker.name,'es');
});}
function ensureDay(date){
  if(state.rosters[date]){state.rosters[date].overrides=state.rosters[date].overrides||{};return state.rosters[date];}
  const staff={};for(const w of state.staff)if(w.active!==false)staff[w.id]=defaultStatus(w,date);
  return state.rosters[date]={staff,overrides:{},createdAt:timestamp()};
}
function isScheduled(status){return ['working','support'].includes(status);}
const statusLabel=status=>({working:'Trabaja',support:'Apoyo',rest:'Descanso',vacation:'Vacaciones',leave:'Permiso',absent:'Faltó',off:'No programado'})[status]||status;
function hasDayControls(date,id){return !!(inspection(date,id)||briefing(date,id)||checklist(date,id)||state.functionChecks.some(x=>x.date===date&&x.staffId===id&&!x.voidedAt));}
function updateSchedule(date,id,value){
  const w=worker(id);if(!w)return;
  if(value==='vacation'&&!vacationOn(w,date)){toast('Registra las fechas de vacaciones desde el botón Vacaciones del trabajador.');render();return false;}
  if(!isScheduled(value)&&hasDayControls(date,id)){toast('Este trabajador tiene controles registrados para la fecha. Revísalos antes de marcar descanso, ausencia o día no programado.');render();return false;}
  if(vacationOn(w,date)&&value!=='vacation'){toast('El trabajador tiene vacaciones registradas ese día. Primero modifica el período de vacaciones.');render();return false;}
  const previous=scheduleStatus(date,id);
  if(value===previous)return true;
  if(value==='absent'&&!isScheduled(previous)&&!confirm('Esta persona no estaba programada para '+formatDate(date)+'. ¿Confirmas que corresponde marcar una falta?')){render();return false;}

    '<div class="two-col">'+rows+'</div>'+

  );

function setUniformDayStatus(id,value){
  if(!['working','support','rest','off','absent','leave'].includes(value))return;
  const changed=updateSchedule(theDate,id,value);
  if(changed){
    if(!isScheduled(value))showUnscheduledUniform=true;
    closeModal();render();
  }
}
function resetUniformDayStatus(id){
  const w=worker(id);if(!w)return;
  const expected=defaultStatus(w,theDate);
  if(!isScheduled(expected)&&hasDayControls(theDate,id)){
    toast('Existen controles registrados. No puedes retirar la programación sin revisar esos registros.');return;
  }
  const roster=state.rosters[theDate];
  if(!roster||!Object.prototype.hasOwnProperty.call(roster.overrides||{},id)){
    closeModal();toast('Ya se aplica el horario habitual.');return;
  }
  const before=scheduleStatus(theDate,id);
  if(!confirm('¿Restaurar para '+w.name+' el horario habitual: '+statusLabel(expected)+'?'))return;
  delete roster.overrides[id];
  roster.staff[id]=expected;
  roster.statusHistory=roster.statusHistory||[];
  roster.statusHistory.push({staffId:id,at:timestamp(),from:before,to:expected,reset:true});
  roster.updatedAt=timestamp();
  if(!isScheduled(expected))showUnscheduledUniform=true;
  mutate('Restaurar horario diario',w.name+' · '+theDate+' · '+statusLabel(expected));
  closeModal();render();toast('Se restauró el horario habitual.');

function getSection(){

// Historial de navegación para el botón Atrás y el gesto de Android.
const NAV_VIEWS=new Set(['functions','functions-month','home','brief','brief-pending','brief-history','brief-stats','brief-export','uniform','implements','requirements','deliveries','uniform-history','uniform-export','personal','settings','incidents','incidents-history','incidents-stats','incidents-reports']);
let navigationReady=false,modalSequence=0;
const modalSnapshots=new Map();
function navigationEntry(v,dialogId=null,depth=0){return {lasFloresNavigation:true,view:v,dialogId,depth};}
function setupNavigation(){
  try{
    const previous=history.state;
    if(previous?.lasFloresNavigation&&NAV_VIEWS.has(previous.view)){
      view=previous.view;
      // Al recargar, no recuperar formularios emergentes sin confirmar.
      history.replaceState(navigationEntry(view,null,Number(previous.depth)||0),'');
    }else{
      view='home';
      history.replaceState(navigationEntry('home',null,0),'');
    }
    navigationReady=true;
  }catch(error){console.warn('Navegación del sistema no disponible:',error);}
}
function pushNavigation(v,dialogId=null){
  if(!navigationReady)return;
  try{
    const current=history.state;
    const depth=current?.lasFloresNavigation?(Number(current.depth)||0):0;
    history.pushState(navigationEntry(v,dialogId,depth+1),'');
  }catch(error){console.warn('No se pudo registrar el historial interno:',error);}
}
function hideModal(){
  const layer=$('#modalLayer');
  layer.classList.remove('open');
  layer.setAttribute('aria-hidden','true');
  $('#modal').innerHTML='';
}
function navigate(v){
  if(!NAV_VIEWS.has(v))return;
  if(v!==view)pushNavigation(v);
  if($('#modalLayer').classList.contains('open'))hideModal();
  view=v;render();window.scrollTo({top:0,behavior:'instant'});
}
function goBack(){
  if($('#modalLayer').classList.contains('open')){closeModal();return;}
  if(navigationReady&&history.state?.lasFloresNavigation&&(Number(history.state.depth)||0)>0){
    history.back();return;
  }
  if(view!=='home')navigate('home');
}
window.addEventListener('popstate',event=>{
  if(!navigationReady)return;
  const target=event.state;
  if(!target?.lasFloresNavigation||!NAV_VIEWS.has(target.view)){
    hideModal();
    return; // Android puede salir cuando ya no quedan pantallas internas.
  }
  if(view!==target.view){
    view=target.view;
    render();
    window.scrollTo({top:0,behavior:'instant'});
  }
  if(target.dialogId&&modalSnapshots.has(target.dialogId)){
    $('#modal').innerHTML=modalSnapshots.get(target.dialogId);
    $('#modalLayer').classList.add('open');
    $('#modalLayer').setAttribute('aria-hidden','false');
  }else{
    hideModal();
  }
});

function saveFunctionReview(){
  const f=$('#functionReviewForm');if(!f)return;const r=state.functionChecks.find(x=>x.id===f.elements.id.value&&!x.voidedAt);if(!r)return;
  const result=f.elements.result.value,note=f.elements.note.value.trim(),corrected=f.elements.corrected.checked,correctionNote=f.elements.correctionNote.value.trim();
  if(!['ok','bad','pending'].includes(result))return;
  if(result==='bad'&&!note)return toast('Describe qué función no cumplió o qué quedó incompleto.');
  if(corrected&&result!=='bad')return toast('La corrección posterior requiere conservar el resultado «No cumplió».');
  if(corrected&&!correctionNote)return toast('Describe qué se corrigió.');
  r.changes=r.changes||[];r.changes.push({at:timestamp(),before:{result:r.result,note:r.note,correctedAt:r.correctedAt,correctionNote:r.correctionNote}});
  Object.assign(r,{result,note,correctedAt:corrected?(r.correctedAt||timestamp()):null,correctionNote:corrected?correctionNote:'',updatedAt:timestamp()});
  mutate('Evaluar función',`${identityOf(r)} · ${r.date} · ${r.area} · ${r.taskLabel} · ${functionLabel(r)}`);closeModal();render();toast('Revisión registrada.');
}
function voidFunctionCheck(id){

  r.voidedAt=timestamp();r.updatedAt=r.voidedAt;mutate('Anular función',`${identityOf(r)} · ${r.date} · ${r.area} · ${r.taskLabel}`);render();

function functionFailureSummary(rows){const m=new Map();for(const r of rows.filter(x=>x.result==='bad')){const key=r.staffId+':'+r.taskId;if(!m.has(key))m.set(key,{name:identityOf(r),area:r.area,label:r.taskLabel,count:0});m.get(key).count++;}return [...m.values()].sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'es'));}

l-head"><h2>Incumplimientos por función y trabajador</h2></div>${functionFailureSummary(rows).map(v=>`<div class="person-row"><div><b>${h(v.name)}</b><div class="person-detail">${h(v.area)} · ${h(v.label)}</div></div>${badge(v.count+' incumplimiento(s)','bad')}</div>`).join('')||emptyHint('Sin incumplimientos registrados','Solo se consideran las funciones evaluadas.')}</div><div class="panel"><div class="panel-head"><h2>Historial del mes</h2><div class="field"><label for="functionResult">Resultado del detalle</label><select id="functionResult">${[['all','Todos'],['ok','Cumplió'],['bad','No cumplió'],['pending','Pendiente de revisar']].map(([v,l])=>`<option value="${v}" ${functionResult===v?'selected':''}>${l}</option>`).join('')}</select></div></div>${detail.map(r=>`<div class="panel-body" style="padding-bottom:0"><b class="small">${h(formatDate(r.date))}</b>${functionCard(r)}</div>`).join('')||emptyHint('Sin registros visibles','Prueba otros filtros.')}</div>`;

// UNIFORMES: se conservan los registros de la versión anterior.
function correctionStatus(r){if(!r||r.result==='conforme')return 'No requerida';const issues=r.issues||[],resolved=r.resolvedIssues||[];const n=issues.filter(i=>!resolved.includes(i)).length;return n===0?'Corregido':n<issues.length?'Parcial':'Pendiente';}

// Revisión rápida: el checklist es la fuente de sus requisitos; la inspección guarda el resultado original.
let quickExpandedId='',quickVerifierDraft='';
const quickIssueId=id=>'req:'+id;
const quickOldRecord=r=>!!r&&!r.quickReview;
function quickState(w){
 const r=inspection(theDate,w.id),c=checklist(theDate,w.id);
 if(r){
  if(r.result==='conforme')return ['Conforme','ok'];
  const v=correctionStatus(r);
  return v==='Corregido'?['Corregido','blue']:v==='Parcial'?['Corrección parcial','warn']:['Observado','bad'];
 }
 if(!c||!c.items.some(i=>i.status))return ['Sin revisar','warn'];
 const a=checklistSummary(c);
 if(a.bad)return [a.corrected?'Corrección parcial':'Observado','bad'];
 if(a.corrected)return ['Corregido','blue'];
 if(a.total&&a.reviewed===a.total)return ['Conforme','ok'];
 return ['En revisión','warn'];
}
function syncQuickInspection(id){
 const w=worker(id),c=checklist(theDate,id);if(!w||!c)return;
 const bad=c.items.filter(i=>i.status==='bad'),complete=c.items.length>0&&c.items.every(i=>i.status);
 let r=inspection(theDate,id);
 if(quickOldRecord(r)||(!r&&!bad.length&&!complete))return;
 const at=timestamp();
 if(!r){r={id:uid(),staffId:id,staffName:w.name,categoryAt:w.category||'',positionAt:w.position||'Mozo',
 date:theDate,quickReview:true,result:bad.length?'observado':'conforme',issues:[],resolvedIssues:[],
 issueLabels:{},note:'Revisión rápida por puesto',createdAt:at,updatedAt:at,correctedAt:null,
 correctionEvents:[],correctionDetails:{}};state.inspections.push(r);}
 if(bad.length&&r.result==='conforme'){
  r.changes=r.changes||[];r.changes.push({at,kind:'Incumplimiento detectado después',before:{result:'conforme',issues:[...(r.issues||[])]}});
  r.result='observado';
 }
 const resolved=new Set(r.resolvedIssues||[]);
 for(const i of bad){
  const key=quickIssueId(i.reqId);
  if(!r.issues.includes(key))r.issues.push(key);
  r.issueLabels[key]=r.issueLabels[key]||i.label;
  if(i.resolvedAt){
   if(!resolved.has(key))r.correctionEvents.push({at:i.resolvedAt,by:i.resolvedBy||'Sin registrar',kind:'corregir',issueId:key});
   resolved.add(key);r.correctionDetails[key]={at:i.resolvedAt,by:i.resolvedBy||'Sin registrar'};
  }else if(resolved.has(key)){
   resolved.delete(key);delete r.correctionDetails[key];
   r.correctionEvents.push({at,by:i.reopenedBy||'Sin registrar',kind:'revertir',issueId:key});
  }
 }
 r.resolvedIssues=[...resolved];r.correctedAt=r.result==='observado'&&r.issues.length&&r.issues.every(k=>resolved.has(k))?at:null;r.updatedAt=at;
}
function quickVerifier(){return ($('#quickVerifier')?.value||quickVerifierDraft||'').trim();}
function quickAnswer(id,reqId,action){
 const w=worker(id);if(!w||!isScheduled(scheduleStatus(theDate,id)))return false;
 if(quickOldRecord(inspection(theDate,id))){toast('Inspección anterior: utiliza Historial para corregirla.');return false;}
 const c=ensureChecklist(id),i=c?.items.find(x=>x.reqId===reqId);if(!i)return false;
 const at=timestamp();
 if(action==='correct'){
  if(i.status!=='bad'||i.resolvedAt)return false;
  const who=quickVerifier();if(!who){toast('Indica quién verificó la corrección.');return false;}
  i.resolvedAt=at;i.resolvedBy=who;
 }else if(action==='reopen'){
  if(i.status!=='bad'||!i.resolvedAt)return false;
  const who=quickVerifier();if(!who){toast('Indica quién verificó la reapertura.');return false;}
  i.resolvedAt=null;i.resolvedBy='';i.reopenedBy=who;
 }else if(i.status==='bad'){
  toast('La falta inicial permanece. Usa Corregir cuando se solucione.');return false;
 }else if(action==='ok'){
  if(i.status==='ok')return false;
  i.status='ok';i.reviewedAt=at;
  if(i.minQty)i.quantity=Math.max(i.minQty,Number(i.quantity)||0);
 }else if(action==='bad'){
  if(i.status==='ok'&&inspection(theDate,id)?.result==='conforme'&&!confirm('El trabajador ya figuraba Conforme. ¿Confirmas el nuevo incumplimiento? Quedará Observado.'))return false;
  i.status='bad';i.reviewedAt=at;i.resolvedAt=null;
  if(i.minQty&&i.quantity===null)i.quantity=0;
 }else if(action==='none'){
  if(!i.status)return false;
  if(inspection(theDate,id)){toast('La inspección inicial ya está registrada y no puede borrarse aquí.');return false;}
  i.status=null;i.quantity=null;i.reviewedAt=null;
 }else return false;
 c.updatedAt=at;syncQuickInspection(id);mutate('Revisar requisito',w.name+' · '+theDate+' · '+i.label+' · '+action);render();return true;
}
function quickAll(id){
 const w=worker(id);if(!w||!isScheduled(scheduleStatus(theDate,id)))return;
 if(quickOldRecord(inspection(theDate,id))){toast('Para esta inspección anterior, utiliza Historial.');return;}
 const c=ensureChecklist(id);if(!c?.items.length){toast('Este puesto no tiene requisitos configurados.');return;}
 const bad=c.items.filter(i=>i.status==='bad'&&!i.resolvedAt);
 const who=bad.length?quickVerifier():'';
 if(bad.length&&!who){toast('Indica quién verificó las correcciones.');return;}
 if(!confirm(bad.length?'¿Confirmas que las faltas fueron corregidas y verificaste todos los requisitos? Quedará CORREGIDO, no Conforme.':'¿Confirmas que verificaste todos los requisitos y cumplen?'))return;
 const at=timestamp();
 for(const i of c.items){
  if(i.status==='bad'){if(!i.resolvedAt){i.resolvedAt=at;i.resolvedBy=who;}}
  else {i.status='ok';i.reviewedAt=at;if(i.minQty)i.quantity=Math.max(i.minQty,Number(i.quantity)||0);}
 }
 c.updatedAt=at;syncQuickInspection(id);
 mutate('Revisión rápida completa',w.name+' · '+theDate+(bad.length?' · Corregido':' · Conforme'));
 render();toast(bad.length?'Correcciones guardadas, incumplimiento inicial conservado.':'Conforme registrado.');
}

function quickPanel(w){
 const old=inspection(theDate,w.id),legacy=quickOldRecord(old);
 const c=checklist(theDate,w.id),items=c?.items||newChecklistItems(w),n=items.filter(i=>i.status).length;
 const rows=items.map(i=>{
  const state=!i.status?'Sin revisar':i.status==='bad'?(i.resolvedAt?'Corregido':'No cumple'):'Cumple';
  const kind=!i.status?'':i.status==='bad'?(i.resolvedAt?'blue':'bad'):'ok';
  const name='<div class="quick-requirement-info"><b>'+h(i.label)+'</b><span class="small">'+h(i.group)+(i.minQty?' · Mínimo '+i.minQty:'')+'</span>'+badge(state,kind)+
   (i.resolvedAt?'<span class="small">Verificado '+h(displayTime(i.resolvedAt))+' por '+h(i.resolvedBy||'Sin identificar')+'</span>':'')+'</div>';
  let buttons='';
  if(!legacy){
    const head='<div class="quick-requirement-actions">';
    const base=' data-id="'+h(w.id)+'" data-req="'+h(i.reqId)+'"';
    if(i.status==='bad')buttons=head+'<button class="button tiny '+(i.resolvedAt?'selected':'primary')+'" data-action="quick-answer"'+base+' data-value="'+(i.resolvedAt?'reopen':'correct')+'">'+(i.resolvedAt?'↩ Reabrir':'✓ Corregir')+'</button></div>';
    else buttons=head+'<button class="button tiny '+(i.status==='ok'?'selected':'')+'" data-action="quick-answer"'+base+' data-value="ok">✓ Cumple</button>'+
    '<button class="button tiny" data-action="quick-answer"'+base+' data-value="bad">× No cumple</button>'+
    '<button class="button tiny" data-action="quick-answer"'+base+' data-value="none">Sin revisar</button></div>';
  }
  return '<div class="quick-requirement">'+name+buttons+'</div>';
 }).join('');
 const top='<div class="space-between"><div><b>Requisitos de '+h(w.position||'Mozo')+'</b><div class="small">'+n+' de '+items.length+' revisados · '+h(formatDate(theDate))+'</div></div>'+
 '<button class="button tiny" data-nav="requirements">Configurar requisitos</button></div>';
 const note=legacy?'<div class="callout warn">Inspección registrada antes de esta función. Puedes ver los requisitos, pero para corregir el historial anterior debes usar «Ver / corregir».</div>':
 '<div class="callout">Cumple desde la primera revisión = Conforme. Si falta algo y luego se verifica la corrección, quedará Corregido, sin borrar el incumplimiento inicial.</div>';
 const foot=legacy?'<div class="toolbar"><button class="button" data-action="detail-inspection" data-id="'+h(old.id)+'">Ver / corregir inspección existente</button></div>':
 '<div class="quick-actions-footer"><div class="field" style="min-width:180px;flex:1"><label>Verificado por (al corregir)</label><input id="quickVerifier" maxlength="90" value="'+h(quickVerifierDraft)+'" placeholder="Nombre del supervisor"></div>'+
 '<button class="button primary" data-action="quick-all" data-id="'+h(w.id)+'" '+(items.length?'':'disabled')+'>✓ Todos cumplen</button></div>';

function recentDelivery(staffId,material,excludeId){
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-RECENT_DELIVERY_DAYS);

function deliveryWarningText(staffId,material){

  const days=Math.max(0,Math.round((fromISO(dateISO())-fromISO(last.date))/864e5));
  return `⚠ ${worker(staffId)?.name||'Este trabajador'} ya recibió ${last.quantity} ${deliveryMaterialName(last).toLocaleLowerCase('es')} el ${formatDate(last.date)} (hace ${days} día(s)). Revisa si corresponde entregar de nuevo.`;

// Selector reutilizable: todas las pantallas que operan sobre UN solo día.
const DAILY_DATE_IDS=new Set(['briefDate','uniformDate','functionDate','staffDate']);
function currentDailyDate(id){
  if(id==='briefDate')return briefDate;
  if(id==='uniformDate')return theDate; // Revisión diaria e Implementos comparten fecha.
  if(id==='functionDate')return functionDate;
  if(id==='staffDate')return staffDate;
  return null;
}
function dailyDateField(id,date,label='Fecha'){
  if(!DAILY_DATE_IDS.has(id))return dateField(id,date,label);
  return '<div class="field day-date-field"><label for="'+h(id)+'">'+h(label)+'</label>'+
   '<div class="day-date-controls" role="group" aria-label="Navegación por '+h(label)+'">'+
   '<button type="button" class="button day-date-arrow" data-action="daily-prev" data-date-id="'+h(id)+'" aria-label="Día anterior" title="Día anterior">‹</button>'+
   '<input id="'+h(id)+'" type="date" value="'+h(date)+'" aria-label="'+h(label)+'">'+
   '<button type="button" class="button day-date-arrow" data-action="daily-next" data-date-id="'+h(id)+'" aria-label="Día siguiente" title="Día siguiente">›</button>'+
   '<button type="button" class="button day-date-today" data-action="daily-today" data-date-id="'+h(id)+'" title="Volver a hoy">Hoy</button>'+
   '</div></div>';
}
function changeDailyDate(id,newDate){
  if(!DAILY_DATE_IDS.has(id))return false;
  const previous=currentDailyDate(id);
  if(newDate===previous)return true;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(newDate||''))||dateISO(fromISO(newDate))!==newDate){
    toast('Selecciona una fecha válida.');render();return false;
  }
  // El cambio de pantalla no elimina registros ni escribe en el almacenamiento.
  // Con guardado manual pendiente o error, informar sin afirmar que se perderá la información.
  if((dirty||saveError)&&!confirm('Hay cambios pendientes de guardar. Cambiar de fecha no los borrará, pero debes guardarlos antes de cerrar la aplicación. ¿Continuar?')){
    render();return false;
  }
  if(id==='briefDate')briefDate=newDate;
  else if(id==='uniformDate')theDate=newDate;
  else if(id==='functionDate')functionDate=newDate;
  else if(id==='staffDate')staffDate=newDate;
  render();return true;
}
function stepDailyDate(id,days){
  if(!DAILY_DATE_IDS.has(id))return false;
  const d=fromISO(currentDailyDate(id));
  if(Number.isNaN(d.getTime()))return changeDailyDate(id,dateISO());
  d.setDate(d.getDate()+days); // Mediodía local: cruza meses, años y cambios de hora.
  return changeDailyDate(id,dateISO(d));
}

function saveIncident(){

 const year=v('occurredDate').slice(0,4),at=timestamp();
 const seq=state.incidents.filter(r=>r.occurredDate.startsWith(year)).reduce((n,r)=>{const m=String(r.code||'').match(/-(\d+)$/);return Math.max(n,m?Number(m[1]):0);},0)+1;

function saveIncidentFollowup(id){
 const r=state.incidents.find(x=>x.id===id),f=$('#incidentFollowupForm');if(!r||!f||r.status==='anulado')return;
 const v=k=>String(f.elements[k]?.value||'').trim(),next=v('status');
 if(!incidentStatusLabels[next]||next==='anulado'||!v('description')||!v('by')){toast('Completa estado, descripción y responsable.');return;}
 if(next==='cerrado'&&r.status!=='cerrado'&&v('kind')!=='verificacion'){toast('Para cerrar, elige Verificación.');return;}
 if(next==='cerrado'&&r.status!=='cerrado'&&!confirm('¿Confirmas que la solución fue verificada?'))return;
 const at=timestamp(),old=r.status;
 r.actions.push({id:uid(),kind:old==='cerrado'&&next!=='cerrado'?'reapertura':v('kind'),description:v('description'),by:v('by'),at,statusBefore:old,statusAfter:next});
 r.status=next;r.updatedAt=at;if(v('confirmedOrigin'))r.confirmedOrigin=v('confirmedOrigin');
 r.personId=v('personId');r.personName=worker(r.personId)?.name||r.personName||'';
 if(next==='cerrado'){r.closedAt=at;r.closedBy=v('by');}else{r.closedAt=null;r.closedBy='';}
 mutate('Seguimiento de incidente',r.code+' · '+next);closeModal();render();toast('Seguimiento guardado.');
}

 modal('Anulación · '+incidentLabel(r),body,foot);
}
function saveIncidentVoid(id){
 const r=state.incidents.find(x=>x.id===id),reason=$('#incidentVoidReason')?.value.trim(),by=$('#incidentVoidBy')?.value.trim();
 if(!r||['cerrado','anulado'].includes(r.status)||!reason||!by){toast('Indica motivo y responsable de la anulación.');return;}
 const at=timestamp();
 r.actions.push({id:uid(),kind:'anulacion',description:reason,by,at,statusBefore:r.status,statusAfter:'anulado'});
 r.status='anulado';r.voidReason=reason;r.voidedAt=at;r.updatedAt=at;
 mutate('Anular incidente',r.code+' · '+reason);closeModal();render();toast('Anulación registrada.');
}

function saveIncidentType(){
 const f=$('#incidentTypeForm');if(!f)return;
 const label=f.elements.label.value.trim().replace(/\s+/g,' '),cat=f.elements.category.value,id=f.elements.id.value;
 if(!label){toast('Escribe el nombre del tipo.');return;}
 if(state.incidentTypes.some(t=>t.id!==id&&t.category===cat&&t.active!==false&&t.label.toLocaleLowerCase('es')===label.toLocaleLowerCase('es'))){toast('Ya existe un tipo activo con ese nombre.');return;}
 const t=state.incidentTypes.find(x=>x.id===id);
 if(t){t.label=label;t.category=cat;t.updatedAt=timestamp();mutate('Editar tipo de incidente',label);}
 else{state.incidentTypes.push({id:'inc-'+uid(),label,category:cat,active:true,createdAt:timestamp(),updatedAt:null});mutate('Crear tipo de incidente',label);}
 openIncidentTypes();toast('Tipo guardado.');
}
function toggleIncidentType(id){
 const t=state.incidentTypes.find(x=>x.id===id);if(!t)return;
 t.active=t.active===false;t.updatedAt=timestamp();
 mutate('Cambiar vigencia tipo de incidente',t.label);openIncidentTypes();
}
function removeIncidentType(id){
 const t=state.incidentTypes.find(x=>x.id===id);if(!t)return;
 if(state.incidents.some(r=>r.typeId===id)){t.active=false;t.updatedAt=timestamp();mutate('Archivar tipo con historial',t.label);openIncidentTypes();toast('Tipo archivado: el historial se conserva.');return;}
 if(!confirm('¿Eliminar el tipo «'+t.label+'»?'))return;
 state.incidentTypes=state.incidentTypes.filter(x=>x.id!==id);mutate('Eliminar tipo de incidente',t.label);openIncidentTypes();
}

 return makeXlsx([{name:'Resumen',rows:sum},{name:'Incidentes',rows,headerRow:1,dateCols:[1]},{name:'Áreas',rows:areas,headerRow:1},{name:'Tipos',rows:types,headerRow:1},{name:'Acciones',rows:actions,headerRow:1,dateCols:[1]}]);

function reportRange(){
  if(reportType==='day')return {start:reportDate,end:reportDate,label:'Diario'};
  if(reportType==='week'){const d=fromISO(reportDate);d.setDate(d.getDate()-((d.getDay()+6)%7));const start=dateISO(d);d.setDate(d.getDate()+6);return {start,end:dateISO(d),label:'Semanal'};}
  const [y,m]=reportMonth.split('-').map(Number);return {start:`${y}-${pad(m)}-01`,end:dateISO(new Date(y,m,0,12)),label:'Mensual'};
}

let dbPromise;
function snapshotDb(){
  if(!('indexedDB' in window))return Promise.reject(Error('IndexedDB no disponible'));
  if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
    const request=indexedDB.open('LasFlores_Recuperacion',1);
    request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('snapshots'))request.result.createObjectStore('snapshots',{keyPath:'id',autoIncrement:true});};
    request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error('Error IndexedDB'));
  }).catch(e=>{dbPromise=null;throw e;});return dbPromise;
}
async function createSnapshot(data,force=false){

  try{const db=await snapshotDb();await new Promise((resolve,reject)=>{
    const tx=db.transaction('snapshots','readwrite');tx.objectStore('snapshots').add({at:timestamp(),data,forced:force});
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
  // Mantener los últimos 25 puntos de recuperación.
  const points=await listSnapshots();if(points.length>25){await new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readwrite');points.slice(25).forEach(p=>tx.objectStore('snapshots').delete(p.id));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
  }catch(e){
    // Si IndexedDB está bloqueado, se intenta una copia local compacta.
    try{const key='lasflores.control.recovery.v2',arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift({id:'local-'+Date.now(),at:timestamp(),data,forced:force});localStorage.setItem(key,JSON.stringify(arr.slice(0,3)));}catch(_){/* se mantiene la base principal */}
  }
}
async function listSnapshots(){

}

    case 'home':navigate('home');break;
    case 'go-back':goBack();break;
    case 'settings':navigate('settings');break;
    case 'toggle-theme':toggleTheme();break;
    case 'manual-save':if(persist()) {toast('Cambios guardados.');if(view==='settings')render();}break;
    case 'quick-toggle':quickExpandedId=quickExpandedId===id?'':id;render();break;
    case 'quick-answer':quickAnswer(id,el.dataset.req,el.dataset.value);break;
    case 'quick-all':quickAll(id);break;
    case 'uniform-day-status':openUniformDayStatus(id);break;
    case 'uniform-set-day':setUniformDayStatus(id,el.dataset.status);break;
    case 'uniform-reset-day':resetUniformDayStatus(id);break;
    case 'vacation-manage':openVacations(id);break;
    case 'vacation-add':addVacation(id);break;
    case 'vacation-remove':removeVacation(id,el.dataset.vacation);break;
    case 'add-person':openPerson();break;
    case 'edit-person':openPerson(worker(id));break;
    case 'save-person':savePerson();break;
    case 'bulk-person':openBulk();break;
    case 'save-bulk':saveBulk();break;
    case 'toggle-person':togglePerson(id);break;
    case 'remove-person':removePerson(id);break;
    case 'uniform-ok':markUniformOk(id);break;
    case 'uniform-bad':openUniformObserved(id);break;
    case 'toggle-uniform-issue':{
      const issue=el.dataset.issue;uniformIssueSelection=uniformIssueSelection.includes(issue)?uniformIssueSelection.filter(x=>x!==issue):[...uniformIssueSelection,issue];
      el.classList.toggle('selected',uniformIssueSelection.includes(issue));el.textContent=(uniformIssueSelection.includes(issue)?'✓ ':'')+(issueType(issue)?.label||issue)+(issueType(issue)?.active===false?' (inactivo)':'');break;
    }
    case 'save-uniform-observed':saveUniformObserved();break;
    case 'detail-inspection':inspectDetails(state.inspections.find(r=>r.id===id));break;
    case 'save-uniform-corrections':saveUniformCorrections(id);break;
    case 'edit-uniform':{const r=state.inspections.find(x=>x.id===id);if(!r)return;theDate=r.date;openUniformObserved(r.staffId,r);break;}
    case 'convert-uniform':{const r=state.inspections.find(x=>x.id===id);if(!r||!confirm('¿Cambiar esta inspección conforme a observada por error de registro?'))return;theDate=r.date;openUniformObserved(r.staffId,r);break;}
    case 'delete-uniform':deleteUniform(id);break;
    case 'clear-uniform-filters':historySearch=historyStart=historyEnd='';render();break;
    case 'open-checklist':openChecklist(id);break;
    case 'check-answer':answerChecklist(id,el.dataset.req,el.dataset.value);break;
    case 'check-resolve':resolveChecklist(id,el.dataset.req);break;
    case 'check-all':markChecklistAll(id);break;
    case 'add-requirement':openRequirement();break;
    case 'edit-requirement':openRequirement(state.requirements.find(r=>r.id===id));break;
    case 'save-requirement':saveRequirement();break;
    case 'toggle-requirement':toggleRequirement(id);break;
    case 'remove-requirement':removeRequirement(id);break;
    case 'open-issue-types':openIssueTypes();break;
    case 'add-issue-type':openIssueTypeForm();break;
    case 'edit-issue-type':openIssueTypeForm(state.issueTypes.find(t=>t.id===id));break;
    case 'save-issue-type':saveIssueType();break;
    case 'toggle-issue-type':toggleIssueType(id);break;
    case 'remove-issue-type':removeIssueType(id);break;
    case 'back-to-observation':{const r=editingInspectionId?state.inspections.find(x=>x.id===editingInspectionId):null;if(selectedPerson)openUniformObserved(selectedPerson,r);break;}
    case 'open-delivery':openDelivery();break;
    case 'save-delivery':saveDelivery();break;
    case 'detail-delivery':deliveryDetails(state.deliveries.find(d=>d.id===id));break;
    case 'delivery-return':openDeliveryReturn(id);break;
    case 'save-delivery-return':saveDeliveryReturn(id);break;
    case 'delivery-void':openDeliveryVoid(id);break;
    case 'save-delivery-void':saveDeliveryVoid(id);break;
    case 'clear-delivery-filters':deliverySearch='';deliveryMaterial='all';deliveryPerson='all';deliveryStart='';deliveryEnd='';render();break;
    case 'daily-prev':stepDailyDate(el.dataset.dateId,-1);break;
    case 'daily-next':stepDailyDate(el.dataset.dateId,1);break;
    case 'daily-today':dailyToday(el.dataset.dateId);break;
    case 'toggle-brief-all':briefShowAll=!briefShowAll;render();break;
    case 'brief-mark':markBriefing(id,el.dataset.value);break;
    case 'brief-inform':markBriefingInformed(id);break;
    case 'brief-inform-history':markInformedHistory(id);break;
    case 'save-topics':saveTopics();break;
    case 'clear-brief-filters':briefHistorySearch=historyStart=historyEnd='';render();break;
    case 'export-uniform':exportReport('uniform');break;
    case 'export-brief':exportReport('brief');break;
    case 'export-all':exportReport('all');break;
    case 'backup-download':exportBackup();break;
    case 'backup-import':$('#backupFile').click();break;
    case 'snapshot-now':if(dirty&&!persist())return;createSnapshot(savedJSON,true).then(()=>{renderRecoveryList();toast('Punto de recuperación creado.');});break;
    case 'restore-snapshot':restoreSnapshot(id);break;
    case 'close-modal':closeModal();break;
  }
}
document.addEventListener('click',event=>{
  const nav=event.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}
  const action=event.target.closest('[data-action]');if(action)handleAction(action);
});
document.addEventListener('change',event=>{
  const x=event.target;
  if(x.id==='incidentCategory'){switchIncidentCategory();return;}
  if(x.id==='incidentType'){toggleIncidentOtherType();return;}
  if(x.id==='incidentFilterCategory'){incidentFilterCategory=x.value;render();return;}
  if(x.id==='incidentFilterStatus'){incidentFilterStatus=x.value;render();return;}
  if(x.id==='incidentFilterArea'){incidentFilterArea=x.value;render();return;}
  if(x.id==='incidentFilterFrom'){incidentFilterFrom=x.value;render();return;}
  if(x.id==='incidentFilterTo'){incidentFilterTo=x.value;render();return;}
  if(x.id==='incidentStatsMonth'){incidentStatsMonth=x.value||dateISO().slice(0,7);render();return;}
  if(DAILY_DATE_IDS.has(x.id)){changeDailyDate(x.id,x.value||dateISO());return;}
  if(x.id==='functionMonth'){functionMonth=x.value||dateISO().slice(0,7);render();return;}
  if(x.id==='functionPerson'){functionPerson=x.value;render();return;}
  if(x.id==='functionArea'){functionArea=x.value;render();return;}
  if(x.id==='functionResult'){functionResult=x.value;render();return;}
  if(x.id==='functionOrder'){functionOrder=x.value;render();return;}
  if(x.matches('[data-schedule]')){updateSchedule(staffDate,x.dataset.schedule,x.value);return;}

  if(x.id==='showUnscheduledUniform'){showUnscheduledUniform=x.checked;render();return;}


  if(x.id==='briefGroup'){briefGroup=x.value;render();return;}
  if(x.id==='uniformHistoryFrom'||x.id==='briefHistoryFrom'){historyStart=x.value;render();return;}
  if(x.id==='uniformHistoryTo'||x.id==='briefHistoryTo'){historyEnd=x.value;render();return;}
  if(x.id==='reportType'){reportType=x.value;render();return;}
  if(x.id==='reportDate'){reportDate=x.value;render();return;}
  if(x.id==='reportMonth'){reportMonth=x.value;render();return;}
  if(x.matches('[data-check-qty]')){setChecklistQuantity(x.dataset.checkQty,x.dataset.req,x.value);return;}
  if(x.id==='statsMonth'){statsMonth=x.value||dateISO().slice(0,7);render();return;}
  if(x.id==='statsPerson'){statsPerson=x.value;render();return;}
  if(x.id==='saveMode'){setAutoSave(x.value==='auto');return;}
  if(x.id==='themeMode'){setTheme(x.value);return;}
  if(x.id==='delMaterial'||x.id==='delReason'){toggleDeliveryOtherFields();updateDeliveryWarning();return;}
  if(x.id==='delStaff'){updateDeliveryWarning();return;}
  if(x.id==='deliveryPerson'){deliveryPerson=x.value;render();return;}
  if(x.id==='deliveryMaterial'){deliveryMaterial=x.value;render();return;}
  if(x.id==='deliveryFrom'){deliveryStart=x.value;render();return;}
  if(x.id==='deliveryTo'){deliveryEnd=x.value;render();return;}
});
document.addEventListener('input',event=>{
  const x=event.target;
  if(x.id==='quickVerifier'){quickVerifierDraft=x.value;return;}
  if(x.id==='incidentSearch'){incidentSearch=x.value;render();const input=$('#incidentSearch');input?.focus();input?.setSelectionRange(incidentSearch.length,incidentSearch.length);return;}
  if(x.id==='staffSearch'){
    staffSearch=x.value;document.querySelectorAll('[data-staff-item]').forEach(row=>row.style.display=row.dataset.search.includes(staffSearch.toLocaleLowerCase('es'))?'':'none');
  }
  if(x.id==='uniformHistorySearch'){
    historySearch=x.value;render();const input=$('#uniformHistorySearch');input?.focus();input?.setSelectionRange(historySearch.length,historySearch.length);
  }
  if(x.id==='briefHistorySearch'){
    briefHistorySearch=x.value;render();const input=$('#briefHistorySearch');input?.focus();input?.setSelectionRange(briefHistorySearch.length,briefHistorySearch.length);
  }
  if(x.id==='deliverySearch'){
    deliverySearch=x.value;render();const input=$('#deliverySearch');input?.focus();input?.setSelectionRange(deliverySearch.length,deliverySearch.length);
  }
});
document.addEventListener('submit',event=>event.preventDefault());
$('#backupFile').addEventListener('change',event=>importBackup(event.target.files?.[0]));
$('#modalLayer').addEventListener('click',event=>{if(event.target===$('#modalLayer'))closeModal();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('#modalLayer').classList.contains('open'))closeModal();});
// El botón manual está disponible desde cualquier módulo, sin regresar al menú principal.
$('#saveIndicator').insertAdjacentHTML('afterend','<button id="globalSave" class="button tiny gold" type="button" data-action="manual-save" hidden>Guardar cambios</button>');
const originalIndicator=updateSaveIndicator;
updateSaveIndicator=function(){originalIndicator();const b=$('#globalSave');if(b){b.hidden=prefs.autoSave||!dirty;b.disabled=!dirty;b.textContent='Guardar cambios';}};
load();setupNavigation();render();
// Actualizaciones PWA: publicar código nuevo NO envía ni modifica los registros guardados.
// La nueva versión se activa al confirmarlo y solo si no hay cambios pendientes.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  let pwaRegistration=null, pwaWaiting=null, pwaApproved=false, pwaDismissed=false;
  const banner=document.getElementById('pwaUpdate');
  function showPwaUpdate(worker){
    if(!worker || !navigator.serviceWorker.controller)return;
    pwaWaiting=worker;
    if(!pwaDismissed){banner.hidden=false;banner.classList.add('show');}
  }
  function watchPwa(reg){
    if(reg.waiting)showPwaUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed' && navigator.serviceWorker.controller)showPwaUpdate(w);});
    });
  }
  document.getElementById('pwaDismissUpdate').addEventListener('click',()=>{
    pwaDismissed=true;banner.hidden=true;banner.classList.remove('show');
  });
  document.getElementById('pwaInstallUpdate').addEventListener('click',()=>{
    if(dirty){toast('Primero pulsa «Guardar cambios» para evitar perder información.');return;}
    if(!pwaWaiting){toast('No hay una actualización pendiente.');return;}
    pwaApproved=true;
    document.getElementById('pwaInstallUpdate').disabled=true;
    document.getElementById('pwaInstallUpdate').textContent='Actualizando…';
    pwaWaiting.postMessage({type:'SKIP_WAITING'});
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(pwaApproved&&!dirty)location.reload();
  });
  window.addEventListener('online',()=>{pwaRegistration?.update().catch(()=>{});});
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})
    .then(reg=>{pwaRegistration=reg;watchPwa(reg);reg.update().catch(()=>{});})
    .catch(error=>console.warn('No se pudo registrar el modo offline:',error));
  setInterval(()=>{if(navigator.onLine)pwaRegistration?.update().catch(()=>{});},60*60*1000);
}
})();
</script>
</body>
</html>
