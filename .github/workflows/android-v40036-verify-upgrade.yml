name: Android 4.0036 - Validación APK firmada sobre 4.0035
on:
  push:
    branches:
      - feature/android-uniform-quick-v40036
    paths:
      - .github/workflows/android-v40036-verify-upgrade.yml
      - android-native/ci/check_portrait_upgrade.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Descargar APK publicadas y verificar SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android-native/dist/previous
          gh release download android-beta-v40035 --dir android-native/dist/previous --pattern 'las-flores-beta.apk*'
          gh release download android-beta-v40036 --dir android-native/dist --pattern 'las-flores-beta.apk*'
          (cd android-native/dist && sha256sum -c las-flores-beta.apk.sha256)
          (cd android-native/dist/previous && sha256sum -c las-flores-beta.apk.sha256)
      - name: Verificar firma común de ambas versiones
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          OLD="$( "$SIGNER" verify --print-certs android-native/dist/previous/las-flores-beta.apk | awk '/certificate SHA-256 digest:/ {print $NF}' )"
          NEW="$( "$SIGNER" verify --print-certs android-native/dist/las-flores-beta.apk | awk '/certificate SHA-256 digest:/ {print $NF}' )"
          test -n "$OLD"
          test "$OLD" = "$NEW"
          echo "Firma compatible verificada."
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar instalación encima de 4.0035 sin perder registros
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 android-native/ci/check_portrait_upgrade.py android-beta-v40036
