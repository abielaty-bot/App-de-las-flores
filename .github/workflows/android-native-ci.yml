name: Las Flores Android CI
on:
  push:
    branches: [android-native-foundation, android-v020-uniformes, android-updater-v030, android-v40001-foundation, android-v40002-uniformes, android-v40003-briefings, android-v40004-funciones, android-v40005-incidentes, android-v40006-reportes, android-v40007-reportes-entregas, android-v40008-identidad, android-v40009-ui-integral, 'feature/android-*']
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-ci.yml'
  pull_request:
    branches: [android-updater-v030, android-v40001-foundation, android-v40002-uniformes, android-v40003-briefings, android-v40004-funciones, android-v40005-incidentes, android-v40006-reportes, android-v40009-ui-integral]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-ci.yml'
  workflow_dispatch:
concurrency:
  group: android-native-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verificar migración SQL de briefings
        run: python3 tools/test_briefing_migration.py
      - name: Unit tests and debug APK
        run: |
          # Las variantes comparten exportación de esquemas Room: compilarlas secuencialmente.
          gradle --no-daemon --no-build-cache --no-parallel -Pksp.incremental=false :app:testDebugUnitTest :app:assembleDebug
          gradle --no-daemon --no-build-cache --no-parallel -Pksp.incremental=false :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: las-flores-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
