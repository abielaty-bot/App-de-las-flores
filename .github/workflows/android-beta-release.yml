name: Las Flores Beta - Release firmada

on:
  push:
    tags:
      - 'android-beta-v*'
    branches:
      - 'publish/android-beta-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar SDK Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Comprobar tag y secretos de firma
        env:
          LF_KEYSTORE_BASE64: ${{ secrets.LF_KEYSTORE_BASE64 }}
          LF_KEYSTORE_PASSWORD: ${{ secrets.LF_KEYSTORE_PASSWORD }}
          LF_KEY_ALIAS: ${{ secrets.LF_KEY_ALIAS }}
          LF_KEY_PASSWORD: ${{ secrets.LF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^publish/android-beta-v[1-9][0-9]*$ ]] || exit 1
            RELEASE_TAG="${GITHUB_REF_NAME#publish/}"
          fi
          [[ "$RELEASE_TAG" =~ ^android-beta-v[1-9][0-9]*$ ]] || exit 1
          VERSION_CODE="${RELEASE_TAG#android-beta-v}"
          echo "LF_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          grep -Eq "versionCode = ${VERSION_CODE}([[:space:]]|$)" app/build.gradle.kts || {
            echo 'La versión del tag no coincide con versionCode.'; exit 1;
          }
          for secret in LF_KEYSTORE_BASE64 LF_KEYSTORE_PASSWORD LF_KEY_ALIAS LF_KEY_PASSWORD; do
            if [[ -z "${!secret:-}" ]]; then
              echo "Falta un secreto necesario: $secret"; exit 1;
            fi
          done
          printf '%s' "$LF_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/las-flores-beta.jks"
          chmod 600 "$RUNNER_TEMP/las-flores-beta.jks"
          echo "LF_KEYSTORE_PATH=$RUNNER_TEMP/las-flores-beta.jks" >> "$GITHUB_ENV"
      - name: Verificar migraciones SQL
        run: python3 tools/test_briefing_migration.py
      - name: Pruebas y APK firmada
        env:
          LF_KEYSTORE_PASSWORD: ${{ secrets.LF_KEYSTORE_PASSWORD }}
          LF_KEY_ALIAS: ${{ secrets.LF_KEY_ALIAS }}
          LF_KEY_PASSWORD: ${{ secrets.LF_KEY_PASSWORD }}
        run: |
          # Evitar que KSP/Room procese debug y release a la vez sobre el mismo directorio de esquemas.
          gradle --no-daemon --no-build-cache --no-parallel -Pksp.incremental=false :app:testDebugUnitTest
          gradle --no-daemon --no-build-cache --no-parallel -Pksp.incremental=false :app:assembleRelease
      - name: Verificar firma y hash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/las-flores-beta.apk
          cd dist
          sha256sum las-flores-beta.apk > las-flores-beta.apk.sha256
      - name: Verificar certificado de la versión anterior
        if: env.LF_RELEASE_TAG == 'android-beta-v40008' || env.LF_RELEASE_TAG == 'android-beta-v40014' || env.LF_RELEASE_TAG == 'android-beta-v40015' || env.LF_RELEASE_TAG == 'android-beta-v40016' || env.LF_RELEASE_TAG == 'android-beta-v40017' || env.LF_RELEASE_TAG == 'android-beta-v40018' || env.LF_RELEASE_TAG == 'android-beta-v40019' || env.LF_RELEASE_TAG == 'android-beta-v40020' || env.LF_RELEASE_TAG == 'android-beta-v40021' || env.LF_RELEASE_TAG == 'android-beta-v40022' || env.LF_RELEASE_TAG == 'android-beta-v40023' || env.LF_RELEASE_TAG == 'android-beta-v40024' || env.LF_RELEASE_TAG == 'android-beta-v40025'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/previous
          PREVIOUS_TAG=android-beta-v40007
          if [[ "$LF_RELEASE_TAG" == "android-beta-v40014" ]]; then
            PREVIOUS_TAG=android-beta-v40013
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40015" ]]; then
            PREVIOUS_TAG=android-beta-v40014
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40016" ]]; then
            PREVIOUS_TAG=android-beta-v40015
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40017" ]]; then
            PREVIOUS_TAG=android-beta-v40016
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40018" ]]; then
            PREVIOUS_TAG=android-beta-v40017
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40019" ]]; then
            PREVIOUS_TAG=android-beta-v40018
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40020" ]]; then
            PREVIOUS_TAG=android-beta-v40019
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40021" ]]; then
            PREVIOUS_TAG=android-beta-v40020
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40022" ]]; then
            PREVIOUS_TAG=android-beta-v40021
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40023" ]]; then
            PREVIOUS_TAG=android-beta-v40022
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40024" ]]; then
            PREVIOUS_TAG=android-beta-v40023
          elif [[ "$LF_RELEASE_TAG" == "android-beta-v40025" ]]; then
            PREVIOUS_TAG=android-beta-v40024
          fi
          gh release download "$PREVIOUS_TAG" --dir dist/previous --pattern 'las-flores-beta.apk*'
          (cd dist/previous && sha256sum -c las-flores-beta.apk.sha256)
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          certificate() {
            "$SIGNER" verify --print-certs "$1" | awk '/certificate SHA-256 digest:/ {print $NF}'
          }
          PREVIOUS_CERT="$(certificate dist/previous/las-flores-beta.apk)"
          NEW_CERT="$(certificate dist/las-flores-beta.apk)"
          test -n "$PREVIOUS_CERT"
          test "$PREVIOUS_CERT" = "$NEW_CERT"
          rm -f "$LF_KEYSTORE_PATH"
      - name: Habilitar KVM para la prueba de actualización
        if: env.LF_RELEASE_TAG == 'android-beta-v40008' || env.LF_RELEASE_TAG == 'android-beta-v40021' || env.LF_RELEASE_TAG == 'android-beta-v40022' || env.LF_RELEASE_TAG == 'android-beta-v40024' || env.LF_RELEASE_TAG == 'android-beta-v40025'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar la actualización firmada en Android
        if: env.LF_RELEASE_TAG == 'android-beta-v40008' || env.LF_RELEASE_TAG == 'android-beta-v40021' || env.LF_RELEASE_TAG == 'android-beta-v40022' || env.LF_RELEASE_TAG == 'android-beta-v40024' || env.LF_RELEASE_TAG == 'android-beta-v40025'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 android-native/ci/check_portrait_upgrade.py "$LF_RELEASE_TAG"
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_CODE="${LF_RELEASE_TAG#android-beta-v}"
          if (( VERSION_CODE >= 10000 )); then
            DISPLAY_VERSION="$((VERSION_CODE / 10000)).$(printf '%04d' "$((VERSION_CODE % 10000))")"
          else
            DISPLAY_VERSION="Beta v${VERSION_CODE}"
          fi
          if gh release view "$LF_RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
              echo "La versión ya existe; no se permite sobrescribir una APK firmada."
              exit 1
            fi
            gh release upload "$LF_RELEASE_TAG" \
              dist/las-flores-beta.apk \
              dist/las-flores-beta.apk.sha256 --clobber
          else
            NOTES="Beta Android firmada. Incluye comprobación de actualizaciones desde la aplicación, verificación SHA-256 y confirmación de instalación mediante Android."
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40014" ]]; then
              NOTES=$(printf '%s\n' '## Personal, Uniformes y navegación' '- Menú lateral desplegable en todos los módulos; al cerrarlo se recupera toda la pantalla.' '- Personal: sábados, domingos, días personalizados, apoyo ocasional y perfil de uniforme.' '- Uniformes: No aplica automático por perfil, excepción manual justificada, búsqueda, filtros, calendario y siguiente trabajador.' '- Moñera: se configura para el perfil femenino por defecto; los perfiles existentes quedan sin definir hasta elegirlos.' '- Conservación de inspecciones anteriores, migración Room 8→9, respaldo JSON v7 y reportes Excel actualizados.' 'Antes de instalar: exporta un respaldo desde Respaldos. Actualiza sin desinstalar la aplicación.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40015" ]]; then
              NOTES=$(printf '%s\n' '## Nuevo centro de actualizaciones' '- Porcentaje y bytes reales, velocidad, tiempo transcurrido y restante estimado.' '- Descarga en segundo plano con notificación, cancelación y reintento; reanudación segura cuando el servidor la acepta.' '- Verificación de espacio, SHA-256, paquete, versión y firma; nueva comprobación antes de instalar.' '- Historial de versiones detectadas, notas, fecha de publicación y avisos opcionales de nuevas versiones.' '- No cambia Room ni el respaldo JSON v7. Se conservan las mejoras de Briefings, Personal, Uniformes y navegación.' 'Antes de actualizar, exporta una copia desde Respaldos. No desinstales la aplicación.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40016" ]]; then
              NOTES=$(printf '%s\n' '## Mi jornada y recordatorios operativos' '- Mi jornada en Inicio: progreso, actividades pendientes y accesos directos.' '- Centro de notificaciones: campana, historial, posponer y completar actividades manuales.' '- Recordatorios personalizados y plantillas; días de trabajo, horarios y período silencioso.' '- Avisos de briefings, comunicación presencial, uniformes, funciones, incidentes prioritarios y resumen de jornada.' '- Alarmas vinculadas a las sesiones y reprogramación al cambiar horarios o reiniciar. Activa los avisos en Notificaciones > Ajustes y concede los permisos de Android.' '- Room 9→10, respaldo JSON v8 y exportación de avisos y actividades persistidas.' '- Incluye el nuevo gestor de descargas de 4.0015 y todas las funciones anteriores.' 'Antes de instalar, crea un respaldo y no desinstales la versión anterior.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40017" ]]; then
              NOTES=$(printf '%s\n' '## Control de celulares' '- Registro diario Sí / No / N/A y pendientes, búsqueda y filtros; excepciones con motivo y observaciones.' '- Historial, estadísticas por día, semana y mes, ranking y fechas de incumplimiento.' '- Excel independiente y datos incluidos en los reportes generales.' '- Integración con personal programado, Mi jornada y recordatorio configurable.' '- No se controla custodia ni devolución: recuperar el celular al salir no altera el cumplimiento.' '- Room 10→11, respaldo JSON v9; conserva los registros anteriores.' 'Antes de actualizar, exporta una copia desde Respaldos. No desinstales la aplicación.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40018" ]]; then
              NOTES=$(printf '%s\n' '## Uniformes por puesto' '- Nuevo filtro Mozos, Caja, Runners y otros puestos; catálogo único con asignación múltiple, perfiles, cantidades, búsqueda y estado.' '- Runner disponible en Personal, independiente de Apoyo; no reclasifica trabajadores existentes.' '- Propuestas opcionales para Caja y Runners: selecciona el puesto y pulsa Aplicar propuesta si corresponde al uniforme real.' '- Filtros por puesto en inspecciones e historial; estadísticas de conformidad inicial y hoja Excel.' '- Conserva todas las inspecciones ya iniciadas. Room v11 sin cambio de esquema, respaldo JSON v10.' '- Incluye Control de celulares de 4.0017.' 'Antes de actualizar, exporta una copia desde Respaldos. No desinstales la aplicación.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40019" ]]; then
              NOTES=$(printf '%s\n' '## Eliminar trabajadores agregados por error' '- Personal: filtros Todos, Activos e Inactivos y acción Eliminar con confirmación.' '- Solo elimina fichas sin registros vinculados. Si tiene historial, muestra los módulos que impiden borrarla y permite desactivar.' '- Comprueba de nuevo los vínculos antes de eliminar en una única transacción. No borra evaluaciones, convocatorias ni otras actividades.' '- Room v11 y respaldo JSON v10 sin cambios. Incluye Uniformes por puesto y Celulares.' 'Antes de actualizar, exporta una copia desde Respaldos. No desinstales la aplicación.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40020" ]]; then
              NOTES=$(printf '%s\n' '## Eliminar una revisión de uniformes creada por error' '- Desde Inspecciones o Historial, incluso revisiones finalizadas: Eliminar revisión errónea.' '- Confirma nombre, fecha, puesto y resultado. Solo elimina esa inspección, sus respuestas, requisitos congelados y eventos; otros días permanecen intactos.' '- Los resultados y las estadísticas dejan de incluir la revisión borrada.' '- Después puedes eliminar la ficha en Personal si no tiene otros registros vinculados (protección de 4.0019).' '- Room v11 y respaldo JSON v10 sin cambios. Incluye todas las mejoras anteriores.' 'Antes de actualizar o eliminar, exporta una copia desde Respaldos. No desinstales la aplicación.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40021" ]]; then
              NOTES=$(printf '%s\n' '## Persistencia y seguridad' '- Room guarda los registros sin exportar JSON; indicadores de guardado y errores para Personal, Uniformes, Briefings, Celulares, Funciones e Incidentes.' '- Copias internas diarias, siete fechas y una copia independiente verificada antes de futuras actualizaciones.' '- Centro de almacenamiento y recuperación con confirmación. Conserva el respaldo externo.' '- Room v11, JSON v10 sin cambio de esquema. Antes de instalar esta primera versión, exporta una copia y actualiza sin desinstalar.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40022" ]]; then
              NOTES=$(printf '%s\n' '## Rediseño de Incidentes' '- Resumen visual, casos pendientes, ficha de detalle integrada y estados por color y texto.' '- Historial cronológico, botones claros y formularios amplios de registro y seguimiento.' '- Diseño borgoña y champán adaptable a tablet vertical y modo oscuro.' '- Conserva Room v11, registros y protección automática de 4.0021.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40023" ]]; then
              NOTES=$(printf '%s\n' '## Eliminar requisitos de uniformes' '- Acción Eliminar con comprobación de historial, confirmación y protección de todos los puestos.' '- No elimina requisitos vinculados a inspecciones, respuestas o auditoría; permite desactivarlos.' '- Muestra requisitos activos por defecto; los inactivos siguen accesibles mediante filtros.' '- Conserva Room v11, datos históricos y respaldo automático.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40024" ]]; then
              NOTES=$(printf '%s\n' '## Catálogo compacto y ficha integral' '- Requisitos agrupados, filtros por puesto y estado, contadores y menú de acciones con eliminación segura.' '- Ficha mensual individual: uniformes, briefings, celulares, funciones, incidentes asignados y materiales; historial por módulo y exportación Excel.' '- Indicadores sin convertir registros pendientes o no evaluados en incumplimientos. Conserva Room v11 y respaldo automático.')
            fi
            if [[ "$LF_RELEASE_TAG" == "android-beta-v40025" ]]; then
              NOTES=$(printf '%s\n' '## Editor profesional de requisitos' '- Editor de pantalla completa con secciones, selección de puestos adaptable, perfiles y cantidades con controles +/-.' '- Resumen previo, botón fijo, confirmación de descarte y permanencia del formulario si falla el guardado.' '- Corrige cierre al activar avisos de actualización en Android 14+: permiso de red y protección del inicio. Verifica activación y reinicio en emulador.' '- Conserva catálogo, ficha individual, Room v11 y respaldos automáticos.')
            fi
            gh release create "$LF_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              dist/las-flores-beta.apk \
              dist/las-flores-beta.apk.sha256 \
              --title "Las Flores ${DISPLAY_VERSION}" \
              --notes "$NOTES" \
              --prerelease
          fi
