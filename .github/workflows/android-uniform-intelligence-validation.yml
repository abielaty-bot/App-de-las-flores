name: Uniform Intelligence - Validación
on:
  push:
    branches:
      - feature/android-uniform-intelligence-v40034
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: python3 tools/test_briefing_migration.py
      - run: gradle --no-daemon --no-build-cache --no-parallel -Pksp.incremental=false :app:testDebugUnitTest
      - run: gradle --no-daemon --no-build-cache --no-parallel -Pksp.incremental=false :app:assembleDebug
