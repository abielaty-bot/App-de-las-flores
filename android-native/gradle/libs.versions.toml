[versions]
agp = "9.1.1"
composeCompiler = "2.2.10"
ksp = "2.3.12"
room = "3.0.3"
sqlite = "2.7.1"
compose = "1.12.1"
material3 = "1.4.0"
activity = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.10.2"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
